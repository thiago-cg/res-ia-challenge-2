[project]
name = "res-ia-legal-rag"
version = "0.1.0"
description = "Local legal RAG prototype for violence against women law"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "psycopg[binary]",
    "pgvector",
    "qdrant-client",
    "pymupdf>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-PyYAML",
]
ml = [
    "sentence-transformers>=6.0.0",
    "transformers>=5.4.0",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs", ".superpowers", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres/Qdrant service",
    "slow: long running test",
]
asyncio_default_fixture_loop_scope = "function"
